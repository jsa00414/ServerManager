<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · ServerManager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #07110d;
      --bg1: #0e1a15;
      --line: rgba(170, 210, 185, 0.14);
      --text: #e7f1eb;
      --muted: #7f9689;
      --accent: #3ddea0;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Sora", system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(61, 222, 160, 0.16), transparent 55%),
        radial-gradient(700px 420px at 90% 85%, rgba(40, 120, 90, 0.22), transparent 50%),
        linear-gradient(160deg, #050a08 0%, var(--bg0) 45%, #0a1511 100%);
    }
    .shell {
      width: min(420px, 100%);
      position: relative;
    }
    .shell::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(61,222,160,.45), transparent 40%, rgba(61,222,160,.12));
      z-index: 0;
      opacity: .7;
    }
    .card {
      position: relative;
      z-index: 1;
      margin: 1px;
      border-radius: 21px;
      background: color-mix(in srgb, var(--bg1) 92%, black);
      border: 1px solid var(--line);
      padding: 36px 28px 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }
    .mark {
      width: 48px; height: 48px; border-radius: 14px;
      display: grid; place-items: center;
      font-weight: 700; letter-spacing: -.02em;
      color: #062016;
      background: linear-gradient(145deg, var(--accent), #1f8f66);
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.05rem);
      letter-spacing: -.04em;
      line-height: 1.1;
      font-weight: 700;
    }
    .tagline {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .95rem;
      line-height: 1.45;
      max-width: 28ch;
    }
    form { margin-top: 28px; display: grid; gap: 14px; }
    label {
      display: grid; gap: 7px;
      font-size: .78rem; color: var(--muted); letter-spacing: .02em;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      color: var(--text);
      border-radius: 12px;
      padding: 13px 14px;
      font: inherit;
      font-size: .95rem;
      outline: none;
    }
    input:focus {
      border-color: rgba(61,222,160,.55);
      box-shadow: 0 0 0 3px rgba(61,222,160,.12);
    }
    button {
      margin-top: 6px;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      color: #062016;
      background: linear-gradient(145deg, #4aefb0, #2bb984);
    }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: .55; cursor: wait; }
    .err {
      min-height: 1.2em;
      margin: 0;
      color: var(--danger);
      font-size: .82rem;
      font-family: "IBM Plex Mono", monospace;
    }
    .foot {
      margin-top: 18px;
      color: var(--muted);
      font-size: .72rem;
      font-family: "IBM Plex Mono", monospace;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="mark" id="mark">SM</div>
      <h1 id="title">ServerManager</h1>
      <p class="tagline" id="tagline">Sign in to manage VPS forwards, GL.iNet, domains, and firewall.</p>
      <form id="form" autocomplete="on">
        <label>Username
          <input id="user" name="username" autocomplete="username" required autofocus />
        </label>
        <label>Password
          <input id="pass" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="err" id="err" aria-live="polite"></p>
        <button type="submit" id="btn">Sign in</button>
      </form>
      <p class="foot" id="foot">Session cookie · HTTPS recommended</p>
    </div>
  </div>
  <script>
    async function loadBrand() {
      try {
        const res = await fetch("/api/branding");
        const data = await res.json();
        if (data.title) {
          document.getElementById("title").textContent = data.title;
          document.title = "Sign in · " + data.title;
          document.getElementById("mark").textContent = String(data.title).slice(0, 2).toUpperCase();
        }
        if (data.tagline) document.getElementById("tagline").textContent = data.tagline;
      } catch (_) {}
    }
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn");
      const err = document.getElementById("err");
      err.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("user").value.trim(),
            password: document.getElementById("pass").value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Login failed");
        location.href = "/";
      } catch (ex) {
        err.textContent = ex.message || "Login failed";
        btn.disabled = false;
      }
    });
    loadBrand();
  </script>
</body>
</html>
